name: iOS build and test

# Läuft nur, wenn sich Swift-Code oder das Projekt ändern. macOS-Minuten zählen zehnfach,
# deshalb sparsam: Doku- und Übungsänderungen lösen keinen Lauf aus.
on:
  push:
    branches: [claude/offline-ipad-app-planning-l4pswu, main]
    paths:
      - "PlayLenseCore/**"
      - "App/**"
      - "Tests/**"
      - "project.yml"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          ls /Applications | grep Xcode || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('PlayLenseCore/Package.swift') }}

      - name: Pick iPad simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=sorted([(rt,x) for rt,xs in d.items() if 'iOS' in rt for x in xs if 'iPad' in x['name']], key=lambda t: t[0]); print(c[-1][1]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep iPad | tail -3

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project PlayLense.xcodeproj \
            -scheme PlayLense \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath .dd \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build.log | grep -E "error:|error |Test Case .* (passed|failed)|Executed|\*\* (BUILD|TEST)|xcodebuild: " || true
          if grep -qE "\*\* TEST FAILED|\*\* BUILD FAILED|error:" build.log; then
            echo "::group::Fehler"
            grep -E "error:" build.log | sort -u | head -80
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
